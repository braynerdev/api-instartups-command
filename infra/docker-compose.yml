# Stack do Docker Swarm (deploy pelo Portainer). Não use name:, pull_policy, container_name,
# restart nem build: o docker stack deploy recusa ou ignora. Guia do servidor: INSTARTUPS/infra/README.md
version: "3.8"

services:
  api-command:
    image: ghcr.io/braynerdev/api-instartups-command:${IMAGE_TAG:-latest}
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      TZ: America/Sao_Paulo
      ConnectionStrings__PostgresConnection: "Host=${DB_HOST:?defina DB_HOST no .env};Port=${DB_PORT:-5432};Database=${DB_NAME:?defina DB_NAME no .env};Username=${DB_USER:?defina DB_USER no .env};Password=${DB_PASSWORD:?defina DB_PASSWORD no .env};SSL Mode=${DB_SSL_MODE:-Prefer};Pooling=true;Minimum Pool Size=0;Maximum Pool Size=50;Gss Encryption Mode=Disable"
      Jwt__Issuer: ${JWT_ISSUER:?defina JWT_ISSUER no .env}
      Jwt__Audience: ${JWT_AUDIENCE:?defina JWT_AUDIENCE no .env}
      CorsPadrao__0: ${CORS_ORIGIN:?defina CORS_ORIGIN no .env}
    volumes:
      - ${JWT_PUBLIC_KEY_FILE:?defina JWT_PUBLIC_KEY_FILE no .env (caminho absoluto no servidor)}:/run/keys/jwt-public.pem:ro
    networks:
      - proxy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 5s
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.instartups-command.rule=Host(`${API_DOMAIN:?defina API_DOMAIN no .env}`) && PathPrefix(`/api/instartups/command`)"
        - "traefik.http.routers.instartups-command.entrypoints=websecure"
        - "traefik.http.routers.instartups-command.tls.certresolver=letsencrypt"
        - "traefik.http.routers.instartups-command.service=instartups-command"
        - "traefik.http.services.instartups-command.loadbalancer.server.port=8080"

# Rede overlay criada uma vez no servidor: docker network create --driver overlay --attachable proxy
networks:
  proxy:
    external: true
